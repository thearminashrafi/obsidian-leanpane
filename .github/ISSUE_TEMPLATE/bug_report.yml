name: Bug report
description: Something does not work
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Operating system, Obsidian version, LeanPane version, output of `lake --version`"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: What did you do, what did you expect, what happened?
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Console output / server log
      description: "Developer console (Cmd/Ctrl+Shift+I) lines mentioning LeanPane, or the Server log tab. Remove anything private."
